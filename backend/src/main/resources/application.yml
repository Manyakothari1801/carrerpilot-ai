spring:
  application:
    name: careerpilot-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE_MB:5}MB
      max-request-size: ${RESUME_MAX_FILE_SIZE_MB:5}MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never

springdoc.swagger-ui.path: /swagger-ui.html

careerpilot:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}
  password-reset:
    expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
    expose-local-token: false
  resume:
    storage-path: ${RESUME_STORAGE_PATH:./runtime/resumes}
    max-file-size-mb: ${RESUME_MAX_FILE_SIZE_MB:5}
  analysis:
    scoring-version: ats-rules-v1
    prompt-version: resume-analysis-v1
    max-ai-input-characters: ${AI_MAX_INPUT_CHARACTERS:30000}
    strong-action-verbs: developed,designed,implemented,built,optimized,automated,led,improved,integrated,deployed,created,delivered,engineered,launched,reduced,increased,managed,architected,streamlined,mentored
    weights:
      ats-section: 30
      ats-keyword: 20
      ats-action-verb: 20
      ats-quantification: 15
      ats-readability: 15
      overall-ats: 40
      overall-section: 20
      overall-keyword: 10
      overall-action-verb: 10
      overall-quantification: 10
      overall-readability: 10
  ai:
    enabled: ${AI_ENABLED:false}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    request-timeout: ${AI_REQUEST_TIMEOUT:PT30S}
  job-match:
    scoring-version: job-match-rules-v1
    min-description-characters: 100
    max-description-characters: 50000
    weights:
      skill: 40
      keyword: 20
      semantic: 25
      experience: 10
      education: 5
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    provider: ${EMBEDDING_PROVIDER:UNAVAILABLE}
    model: ${EMBEDDING_MODEL:}

logging:
  level:
    root: INFO
    com.careerpilot: INFO
  pattern.console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} message=\"%msg\"%n"

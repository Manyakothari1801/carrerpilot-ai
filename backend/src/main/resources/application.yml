spring:
  application:
    name: careerpilot-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never

springdoc.swagger-ui.path: /swagger-ui.html

careerpilot:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}
  password-reset:
    expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
    expose-local-token: false

logging:
  level:
    root: INFO
    com.careerpilot: INFO
  pattern.console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} message=\"%msg\"%n"
